<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reel Studio</title>
<style>
  :root{--bg:#0b1020;--card:#121a30;--field:#0e1628;--line:#24304f;--text:#e8ecf7;--muted:#8d99b8;--a1:#6366f1;--a2:#8b5cf6}
  *{box-sizing:border-box}
  body{margin:0 auto;max-width:520px;padding:20px 16px 40px;background:var(--bg);color:var(--text);
       font-family:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .logo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-size:20px;color:#fff;
        background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 6px 18px rgba(99,102,241,.35)}
  h1{font-size:21px;font-weight:700;margin:0;letter-spacing:.2px}
  header p{margin:2px 0 0;font-size:13px;color:var(--muted)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px 18px}
  label{display:block;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
  select,input[type=file],textarea{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:15px;font-family:inherit}
  select:focus,textarea:focus{outline:none;border-color:var(--a1);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
  textarea{min-height:70px;resize:vertical}
  .row{display:flex;gap:12px}.row>div{flex:1;min-width:0}
  .chk{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:15px}
  .chk input{width:18px;height:18px;accent-color:var(--a1)}
  #go{width:100%;margin-top:18px;height:52px;border:0;border-radius:12px;color:#fff;font-size:16px;font-weight:700;letter-spacing:.3px;
      background:linear-gradient(135deg,var(--a1),var(--a2));box-shadow:0 8px 20px rgba(99,102,241,.35);cursor:pointer}
  #go:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
  #status{margin:14px 2px;font-size:14px;min-height:20px;color:var(--muted)}
  canvas{width:100%;border-radius:14px;background:#000;display:none;margin-top:6px;border:1px solid var(--line)}
  #dl{display:none;margin-top:14px;text-align:center;padding:14px;border-radius:12px;background:#10b981;color:#fff;font-weight:700;text-decoration:none}
  video{display:none}
</style>
</head>
<body>
<header><div class="logo">▶</div><div><h1>Reel Studio</h1><p>One-tap reels for Instagram, Facebook &amp; TikTok</p></div></header>
<div class="card">

<label>Select video</label>
<input type="file" id="file" accept="video/*">

<div class="row">
  <div><label>Platform</label>
    <select id="platform">
      <option value="instagram">Instagram</option>
      <option value="facebook">Facebook</option>
      <option value="tiktok">TikTok</option>
    </select></div>
  <div><label>Duration</label>
    <select id="dur">
      <option value="0">Auto</option>
      <option value="20">20 seconds</option>
      <option value="30">30 seconds</option>
      <option value="60">60 seconds</option>
    </select></div>
</div>

<div class="row">
  <div><label>Filter</label>
    <select id="filter">
      <option value="vip">VIP Mix (Recommended)</option>
      <option value="vivid">Vivid</option>
      <option value="warm">Warm</option>
      <option value="cool">Cool</option>
      <option value="bw">B&amp;W</option>
      <option value="none">None</option>
    </select></div>
  <div><label>Caption highlight</label>
    <select id="capcolor">
      <option value="#FFE600">Yellow</option>
      <option value="#3DFF7A">Green</option>
      <option value="#FF5FA2">Pink</option>
      <option value="#35E6FF">Cyan</option>
    </select></div>
</div>

<div class="row">
  <div><label>Captions</label>
    <select id="capmode">
      <option value="auto">Auto (from speech)</option>
      <option value="manual">Type manually</option>
      <option value="none">Off</option>
    </select></div>
  <div><label>Speech language</label>
    <select id="lang">
      <option value="">Detect automatically</option>
      <option value="hindi">Hindi</option>
      <option value="english">English</option>
    </select></div>
</div>

<textarea id="manual" placeholder="Type your captions here (used when 'Type manually' is selected)" style="display:none;margin-top:10px"></textarea>

<label>Quality</label>
<select id="quality">
  <option value="0.667">Smooth (720p, recommended)</option>
  <option value="1">HD (1080p, needs a fast phone)</option>
</select>

<div class="chk"><input type="checkbox" id="border" checked><span>Add border</span></div>

</div>
<button id="go" disabled>Create Reel</button>
<div id="status"></div>
<canvas id="cv"></canvas>
<a id="dl">Download Reel</a>
<video id="v" playsinline></video>

<script>
const W = 1080, H = 1920;
const MARGIN = { instagram: 260, facebook: 240, tiktok: 340 };
const FILTERS = {
  vip: "contrast(1.12) saturate(1.25) brightness(1.03)",
  vivid: "contrast(1.1) saturate(1.4) brightness(1.03)",
  warm: "sepia(0.25) saturate(1.2) brightness(1.03)",
  cool: "hue-rotate(-12deg) saturate(1.1) contrast(1.05)",
  bw: "grayscale(1) contrast(1.2)",
  none: "none"
};
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const bgc = document.createElement("canvas"); bgc.width = 135; bgc.height = 240;
const bgx = bgc.getContext("2d");
cv.width = W; cv.height = H;
const v = $("v");
let fileObj = null, AC = null, SRC = null;

const status = t => $("status").textContent = t;
$("file").onchange = e => { fileObj = e.target.files[0]; $("go").disabled = !fileObj; };
$("capmode").onchange = () => $("manual").style.display = $("capmode").value === "manual" ? "block" : "none";

function cover(vw, vh, bw, bh) { const s = Math.max(bw / vw, bh / vh); return [s * vw, s * vh]; }
function fit(vw, vh, bw, bh) { const s = Math.min(bw / vw, bh / vh); return [s * vw, s * vh]; }

// ---------- कैप्शन (आवाज़ से) ----------
async function transcribe(file, dur, lang) {
  status("Loading AI model (first run takes a little longer)...");
  const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.2");
  const asr = await pipeline("automatic-speech-recognition", "Xenova/whisper-base");
  status("Transcribing speech...");
  const buf = await file.arrayBuffer();
  const ac = new AudioContext({ sampleRate: 16000 });
  const audio = await ac.decodeAudioData(buf);
  const data = audio.getChannelData(0).slice(0, Math.floor(dur * 16000));
  const opts = { return_timestamps: "word", chunk_length_s: 30, task: "transcribe" };
  if (lang) opts.language = lang;
  const out = await asr(data, opts);
  return (out.chunks || []).map(c => ({ s: c.timestamp[0], e: c.timestamp[1] ?? c.timestamp[0] + 0.4, t: c.text.trim() }))
    .filter(w => w.t);
}

function manualWords(text, dur) {
  const parts = text.trim().split(/\s+/).filter(Boolean);
  const step = dur / Math.max(parts.length, 1);
  return parts.map((t, i) => ({ s: i * step, e: (i + 1) * step, t }));
}

// ---------- ड्रॉइंग ----------
function drawCaptions(words, t, color, margin) {
  let i = words.findIndex(w => t >= w.s && t < w.e);
  if (i < 0) return;
  const g0 = Math.floor(i / 3) * 3, group = words.slice(g0, g0 + 3);
  const size = 84;
  ctx.font = `800 ${size}px "Noto Sans Devanagari", Arial, sans-serif`;
  const label = w => /^[\x00-\x7F]*$/.test(w.t) ? w.t.toUpperCase() : w.t;
  const gap = 24;
  const widths = group.map(w => ctx.measureText(label(w)).width);
  const total = widths.reduce((a, b) => a + b, 0) + gap * (group.length - 1);
  const age = t - words[i].s;
  const pop = age < 0.12 ? 0.75 + 0.3 * (age / 0.12) : (age < 0.2 ? 1.05 - 0.05 * ((age - 0.12) / 0.08) : 1);
  const cx = W / 2, cy = H - margin;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(pop, pop);
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  ctx.lineJoin = "round"; ctx.lineWidth = 14; ctx.strokeStyle = "#000";
  let x = -total / 2;
  group.forEach((w, k) => {
    ctx.strokeText(label(w), x, 0);
    ctx.fillStyle = (g0 + k === i) ? color : "#fff";
    ctx.fillText(label(w), x, 0);
    x += widths[k] + gap;
  });
  ctx.restore();
}

function grade(f, x, y, w, h) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  const boost = a => { ctx.globalCompositeOperation = "overlay"; ctx.globalAlpha = a; ctx.drawImage(v, x, y, w, h); };
  const tint = (c, op) => { ctx.globalCompositeOperation = op; ctx.globalAlpha = 1; ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  if (f === "vip") boost(0.4);
  else if (f === "vivid") boost(0.6);
  else if (f === "warm") { boost(0.2); tint("rgba(255,150,60,.22)", "soft-light"); }
  else if (f === "cool") { boost(0.2); tint("rgba(60,140,255,.25)", "soft-light"); }
  else if (f === "bw") { tint("#808080", "saturation"); boost(0.4); }
  ctx.restore();
}

function drawFrame(o) {
  ctx.setTransform(o.scale, 0, 0, o.scale, 0, 0);
  const vw = v.videoWidth, vh = v.videoHeight, b = o.border;
  // धुंधला बैकग्राउंड (छोटे कैनवस से → सस्ता और स्मूथ)
  const [cw, ch] = cover(vw, vh, 135, 240);
  bgx.drawImage(v, (135 - cw) / 2, (240 - ch) / 2, cw, ch);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "low";
  ctx.filter = "none";
  ctx.drawImage(bgc, 0, 0, W, H);
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(0, 0, W, H);
  // मुख्य वीडियो + फ़िल्टर
  const [fw, fh] = fit(vw, vh, W - 2 * b, H - 2 * b);
  const fx = (W - fw) / 2, fy = (H - fh) / 2;
  ctx.drawImage(v, fx, fy, fw, fh);
  grade(o.filter, fx, fy, fw, fh);
  if (o.filter === "vip") {
    // टील-ऑरेंज सिनेमैटिक टोन + विग्नेट
    ctx.save();
    ctx.beginPath(); ctx.rect(fx, fy, fw, fh); ctx.clip();
    ctx.globalCompositeOperation = "soft-light";
    const g = ctx.createLinearGradient(0, fy, 0, fy + fh);
    g.addColorStop(0, "rgba(0,130,160,.45)"); g.addColorStop(1, "rgba(255,140,40,.45)");
    ctx.fillStyle = g; ctx.fillRect(fx, fy, fw, fh);
    ctx.globalCompositeOperation = "source-over";
    const r = ctx.createRadialGradient(W / 2, H / 2, fh * 0.25, W / 2, H / 2, fh * 0.65);
    r.addColorStop(0, "rgba(0,0,0,0)"); r.addColorStop(1, "rgba(0,0,0,.35)");
    ctx.fillStyle = r; ctx.fillRect(fx, fy, fw, fh);
    ctx.restore();
  }
  if (b > 0) { ctx.strokeStyle = "#fff"; ctx.lineWidth = b; ctx.strokeRect(b / 2, b / 2, W - b, H - b); }
  if (o.words.length) drawCaptions(o.words, v.currentTime, o.color, o.margin);
}

// ---------- मुख्य काम ----------
$("go").onclick = async () => {
  try {
    $("go").disabled = true; $("dl").style.display = "none";
    // audio context must start right at the tap, otherwise the browser keeps it silent
    if (!AC) { AC = new AudioContext(); SRC = AC.createMediaElementSource(v); }
    AC.resume();
    v.src = URL.createObjectURL(fileObj);
    await new Promise(r => v.onloadedmetadata = r);
    const total = v.duration;
    let dur = +$("dur").value || ([60, 30, 20].find(d => total >= d) || Math.floor(total));
    dur = Math.min(dur, total);

    let words = [];
    const mode = $("capmode").value;
    if (mode === "auto") words = await transcribe(fileObj, dur, $("lang").value);
    else if (mode === "manual") words = manualWords($("manual").value, dur);

    const o = {
      words, border: $("border").checked ? 14 : 0, filter: $("filter").value,
      color: $("capcolor").value, margin: MARGIN[$("platform").value]
    };

    status("Rendering your reel... keep the screen on until it finishes.");
    cv.style.display = "block";
    const sc = +$("quality").value;
    o.scale = sc; cv.width = Math.round(W * sc); cv.height = Math.round(H * sc);
    await AC.resume();
    v.muted = false; v.volume = 1;
    const dest = AC.createMediaStreamDestination();
    SRC.connect(dest);
    const stream = cv.captureStream(30);
    dest.stream.getAudioTracks().forEach(t => stream.addTrack(t));
    const mime = ["video/mp4;codecs=avc1,mp4a.40.2", "video/mp4;codecs=avc1", "video/webm;codecs=vp9,opus", "video/webm;codecs=vp9", "video/webm"].find(m => MediaRecorder.isTypeSupported(m));
    const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 8e6 });
    const chunks = [];
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    const done = new Promise(r => rec.onstop = r);

    v.currentTime = 0;
    await new Promise(r => v.onseeked = r);
    rec.start(500);
    await v.play();
    const tick = () => {
      drawFrame(o);
      status(`Rendering: ${Math.floor(v.currentTime)} / ${dur} sec`);
      if (v.currentTime >= dur || v.ended) { v.pause(); rec.stop(); return; }
      next();
    };
    const next = () => v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(tick);
    next();
    await done;
    SRC.disconnect(dest);

    const ext = mime.startsWith("video/mp4") ? "mp4" : "webm";
    const url = URL.createObjectURL(new Blob(chunks, { type: mime }));
    $("dl").href = url; $("dl").download = `reel_${$("platform").value}.${ext}`;
    $("dl").style.display = "block";
    status("Done! Download your reel below.");
  } catch (err) {
    console.error(err);
    status("Error: " + (err.message || err));
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
